name: Android verification and APKs
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build native SSH
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./scripts/build-ssh.sh
      - name: Configure optional release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.VISORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VISORA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VISORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VISORA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            echo 'Signing unconfigured: building unsigned release and debug preview.'
            exit 0
          fi
          : "${KEYSTORE_BASE64:?Incomplete signing configuration}"
          : "${STORE_PASSWORD:?Incomplete signing configuration}"
          : "${KEY_ALIAS:?Incomplete signing configuration}"
          : "${KEY_PASSWORD:?Incomplete signing configuration}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/visora-release.jks"
          printf 'VISORA_KEYSTORE=%s\n' "$RUNNER_TEMP/visora-release.jks" >> "$GITHUB_ENV"
          printf 'VISORA_STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'VISORA_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'VISORA_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Check Kotlin formatting
        run: ./scripts/format.sh --dry-run --set-exit-if-changed
      - name: Verify and package
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug assembleRelease --console=plain
      - name: Prepare APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/VISORA-debug-preview.apk
          if [[ -n "${VISORA_KEYSTORE:-}" ]]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/VISORA-release.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify artifacts/VISORA-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/VISORA-release-unsigned.apk
          fi
          (cd artifacts && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VISORA-apks
          path: artifacts/*
          if-no-files-found: error
      - name: Attach APKs to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.apk artifacts/SHA256SUMS --clobber
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/visora-release.jks"
